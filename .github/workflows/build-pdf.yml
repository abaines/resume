name: Build Resume PDF
run-name: Resume ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Resume version, 3 digits then 1 capital letter (e.g. 107V)
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    name: Render README.md with markdown-to-pdf (Docker action, Linux runner)
    runs-on: ubuntu-26.04
    steps:
      - name: Check version is 3 digits then 1 capital letter (e.g. 107V)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]{3}[A-Z]$ ]]

      - name: Check out without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render README.md to PDF and HTML (markdown-to-pdf fork, image pinned by digest)
        uses: abaines/markdown-to-pdf@3204cd8c90570ae50adeddb62a9c19dbc6370e48 # fork-v4.1.1
        with:
          input_path: ./README.md
          output_dir: generated/
          build_html: true

      - name: Check outputs landed in generated/ (output_dir needs its trailing slash)
        run: test -f generated/README.pdf && test -f generated/README.html

      - name: Copy outputs (root-owned by the Docker action) to artifact/ as "Alan Baines Resume <date>_<version>" (date in America/New_York)
        id: rename
        env:
          VERSION: ${{ inputs.version }}
        run: |
          base="Alan Baines Resume $(TZ=America/New_York date +%F)_${VERSION}"
          mkdir artifact
          cp generated/README.pdf "artifact/${base}.pdf"
          cp generated/README.html "artifact/${base}.html"
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      - name: Upload PDF and HTML as an artifact with the same name
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.rename.outputs.base }}
          path: artifact/
          if-no-files-found: error

      - name: Lay out the Pages site (HTML as index.html, PDF at a stable unversioned name)
        run: |
          mkdir site
          cp generated/README.html site/index.html
          cp generated/README.pdf site/Alan-Baines-Resume.pdf

      - name: Upload the site for GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: Publish to GitHub Pages
    needs: render
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the uploaded site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
